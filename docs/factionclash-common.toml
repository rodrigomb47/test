#Campaign layout (PROPOSED defaults)
[campaign]
	#Half-width in blocks of the square campaign map centred on world spawn.
	# Default: 320
	# Range: 160 ~ 4096
	mapRadius = 320
	#Number of human factions (Ember Legion, Grove Covenant, Tide Alliance, Stoneguard).
	# Default: 4
	# Range: 2 ~ 4
	humanFactions = 4
	#Number of The Hollow monster lairs.
	# Default: 2
	# Range: 0 ~ 4
	monsterLairs = 2
	#Start a campaign automatically when a world without one loads.
	autoStart = false
	#Keep bases, workplaces and travelling NPCs' chunks ticking so factions progress away from players.
	keepFactionAreasLoaded = true

#NPC movement (PROPOSED defaults)
[movement]
	#How far across (blocks) the stuck-recovery teleport may move an NPC to a safe spot nearer its goal.
	# Default: 4
	# Range: 1 ~ 8
	unstuckHorizontal = 4
	#How far up or down (blocks) the stuck-recovery teleport may move an NPC.
	# Default: 2
	# Range: 1 ~ 4
	unstuckVertical = 2

#Recruitment (PROPOSED defaults)
[survival]
	#NPCs have a food bar like a player's (food, saturation, exhaustion): they eat from what they carry,
	#regenerate only when fed and starve when empty (down to 10 health on Easy, 1 on Normal, death on Hard).
	hunger = true
	#Tools, weapons, bows and armour lose durability as a player's do and break when used up.
	#The blacksmith repairs good gear at the anvil and crafts replacements.
	toolWear = true
	#Exhaustion a working NPC builds up per in-game day on top of what its actions cost the vanilla way
	#(walking costs a player nothing). 4 exhaustion = 1 food or saturation point. PROPOSED: 30 (~1.5 bread a day).
	# Default: 30.0
	# Range: 0.0 ~ 400.0
	workExhaustionPerDay = 30.0

[achievements]
	#Factions make the vanilla advancements through what their NPCs do the way a player would,
	#and through their players' own advancements.
	enabled = true
	#Announce a faction's advancements in chat, like a player's (only those vanilla announces).
	announce = true
	#Also give the faction's advancements to its players as real advancements
	#(on joining, logging in, and whenever the faction makes a new one).
	grantToFactionPlayers = false

[recruitment]
	#Hunger points of food consumed per recruit (bread=5, cooked beef=8, ...).
	# Default: 20
	# Range: 0 ~ 400
	foodValue = 20
	#Minimum ticks between recruitments at one base.
	# Default: 1200
	# Range: 100 ~ 72000
	intervalTicks = 1200
	#Desired share of soldiers that are archers.
	# Default: 0.4
	# Range: 0.0 ~ 1.0
	rangedShare = 0.4

#Scouting and war (PROPOSED defaults)
[war]
	#Maximum distance from home a scout explores.
	# Default: 160
	# Range: 32 ~ 2048
	scoutRange = 160
	#A scout away longer than this is presumed lost and replaced.
	# Default: 24000
	# Range: 1200 ~ 240000
	scoutOverdueTicks = 24000
	#Enemy sightings older than this are shown as stale.
	# Default: 24000
	# Range: 1200 ~ 480000
	reportStaleTicks = 24000
	#Soldiers a faction always keeps at home.
	# Default: 3
	# Range: 0 ~ 20
	homeDefenders = 3
	#Smallest raid party. A faction sends every soldier beyond a third of its garrison (keeping at
	#least homeDefenders at home), so with 12 soldiers it raids with 8.
	# Default: 3
	# Range: 1 ~ 20
	raidPartySize = 3
	#Minimum ticks between raids launched by one faction.
	# Default: 36000
	# Range: 1200 ~ 480000
	raidIntervalTicks = 36000
	#Monsters a Hollow lair keeps at the start.
	# Default: 5
	# Range: 0 ~ 40
	lairBaseCap = 5
	#Monsters a Hollow lair grows to over time.
	# Default: 12
	# Range: 0 ~ 80
	lairMaxCap = 12
	#Minimum ticks between Hollow raids from one lair.
	# Default: 30000
	# Range: 1200 ~ 480000
	lairRaidIntervalTicks = 30000
