#Campaign layout (PROPOSED defaults)
[campaign]
	#Half-width in blocks of the square campaign map centred on world spawn.
	# Default: 320
	# Range: 160 ~ 4096
	mapRadius = 320
	#Number of human factions (Ember Legion, Grove Covenant, Tide Alliance, Stoneguard).
	# Default: 4
	# Range: 2 ~ 4
	humanFactions = 4
	#Number of The Hollow monster lairs.
	# Default: 2
	# Range: 0 ~ 4
	monsterLairs = 2
	#Start a campaign automatically when a world without one loads.
	autoStart = false
	#Keep bases, workplaces and travelling NPCs' chunks ticking so factions progress away from players.
	keepFactionAreasLoaded = true

#NPC movement (PROPOSED defaults)
[movement]
	#How far across (blocks) the stuck-recovery teleport may move an NPC to a safe spot nearer its goal.
	# Default: 4
	# Range: 1 ~ 8
	unstuckHorizontal = 4
	#How far up or down (blocks) the stuck-recovery teleport may move an NPC.
	# Default: 2
	# Range: 1 ~ 4
	unstuckVertical = 2

#Survival: NPCs get hungry and their gear wears out like a player's
[survival]
	#NPCs have a food bar like a player's (food, saturation, exhaustion): they eat from what they carry,
	#regenerate only when fed and starve when empty (down to 10 health on Easy, 1 on Normal, death on Hard).
	hunger = true
	#Tools, weapons, bows and armour lose durability as a player's do and break when used up.
	#The blacksmith repairs good gear at the anvil and crafts replacements.
	toolWear = true
	#Exhaustion a working NPC builds up per in-game day on top of what its actions cost the vanilla way
	#(walking costs a player nothing). 4 exhaustion = 1 food or saturation point. PROPOSED: 30 (~1.5 bread a day).
	# Default: 30.0
	# Range: 0.0 ~ 400.0
	workExhaustionPerDay = 30.0

#Faction achievements: the vanilla advancements, made by a faction
[achievements]
	#Factions make the vanilla advancements through what their NPCs do the way a player would,
	#and through their players' own advancements.
	enabled = true
	#Announce a faction's advancements in chat, like a player's (only those vanilla announces).
	announce = true
	#Also give the faction's advancements to its players as real advancements
	#(on joining, logging in, and whenever the faction makes a new one).
	grantToFactionPlayers = false

#Workers: where miners, woodcutters and fishermen work (PROPOSED defaults)
[workplaces]
	#Farthest distance (blocks, along either axis) from the base centre at which a miner opens a mine.
	#The nearest is fixed at the walls' half-size + 8 (32 blocks).
	# Default: 64
	# Range: 40 ~ 128
	mineSiteRadius = 64
	#Mines a base may be working at once (unfinished and not resting). Each has a miner of its own;
	#while every site is taken, a spare miner helps in one, on another of its levels.
	# Default: 3
	# Range: 1 ~ 8
	maxOpenMines = 3
	#Woodcutters fell natural trees within this many blocks of the base centre.
	#When there are none, they walk 72 blocks out from the centre to look for more. At least 41, so a new base's starter trees are in it.
	# Default: 64
	# Range: 41 ~ 128
	forestRadius = 64
	#Saplings the woodcutter keeps growing in the base's always-ticking work area, so treeless land still
	#gives wood (twice as many while the base is short of wood). 0 = only replant felled trees.
	# Default: 16
	# Range: 0 ~ 32
	groveSize = 16
	#Fishing water is searched for within this many blocks of the base centre.
	#Water a fisherman finds while foraging may be up to 40 blocks further.
	# Default: 64
	# Range: 32 ~ 128
	fishingRadius = 64
	#In open water (5x5, 2 deep, open sky, as for a player) the vanilla treasure catches can be fished.
	fishingTreasure = true
	#Between dusk and dawn (day time 13000-23000), woodcutters and fishermen do not work more than
	#16 blocks outside the walls, where the guards cannot protect them.
	remoteWorkInDaylightOnly = true

#Recruitment (PROPOSED defaults)
[recruitment]
	#Hunger points of food consumed per recruit (bread=5, cooked beef=8, ...).
	# Default: 20
	# Range: 0 ~ 400
	foodValue = 20
	#Minimum ticks between recruitments at one base.
	# Default: 1200
	# Range: 100 ~ 72000
	intervalTicks = 1200
	#Desired share of soldiers that are archers.
	# Default: 0.4
	# Range: 0.0 ~ 1.0
	rangedShare = 0.4

#Scouting and war (PROPOSED defaults)
[war]
	#Maximum distance from home a scout explores.
	# Default: 160
	# Range: 32 ~ 2048
	scoutRange = 160
	#A scout away longer than this is presumed lost and replaced.
	# Default: 24000
	# Range: 1200 ~ 240000
	scoutOverdueTicks = 24000
	#Enemy sightings older than this are shown as stale.
	# Default: 24000
	# Range: 1200 ~ 480000
	reportStaleTicks = 24000
	#When a human faction conquers another, the surviving factions (two or more) swear a pact against
	#the conqueror: no fighting between them, the conqueror's bases revealed, joint raids on it.
	pacts = true
	#Soldiers a faction always keeps at home.
	# Default: 3
	# Range: 0 ~ 20
	homeDefenders = 3
	#Smallest raid party. A faction sends every soldier beyond a third of its garrison (keeping at
	#least homeDefenders at home), so with 12 soldiers it raids with 8.
	# Default: 3
	# Range: 1 ~ 20
	raidPartySize = 3
	#Minimum ticks between raids launched by one faction.
	# Default: 36000
	# Range: 1200 ~ 480000
	raidIntervalTicks = 36000
	#Monsters a Hollow lair keeps at the start.
	# Default: 5
	# Range: 0 ~ 40
	lairBaseCap = 5
	#Monsters a Hollow lair grows to over time.
	# Default: 12
	# Range: 0 ~ 80
	lairMaxCap = 12
	#Minimum ticks between Hollow raids from one lair.
	# Default: 30000
	# Range: 1200 ~ 480000
	lairRaidIntervalTicks = 30000
