plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        clientViewer {
            client()
            programArguments.addAll '--quickPlayMultiplayer', 'localhost:25565', '--username', 'Viewer'
            // the screenshot viewer logs hero animation markers with their ticks and hero render times (HEROES_V2 A2)
            systemProperty 'factionclash.heroMarkers', 'true'
            systemProperty 'factionclash.heroRenderStats', 'true'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // the slice heroes' format-2 test fixtures (test data, never shipped) for the ability GameTests (HEROES_V2 A3)
            systemProperty 'factionclash.sliceFixtures', file('src/test/resources/heroes/slice').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    // GeckoLib is vendored (libs/maven, copied from dl.cloudsmith.io; hashes in docs/HANDOFF.md) and only taken from
    // there, so the build needs no network access for it.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Vendored GeckoLib'
                url = file('libs/maven')
                metadataSources {
                    gradleMetadata()
                    mavenPom()
                    artifact()
                }
            }
        }
        filter {
            includeGroup 'software.bernie.geckolib'
        }
    }
    mavenCentral()
}

dependencies {
    // Embedded in our jar (META-INF/jarjar), so players install only factionclash.
    jarJar(implementation("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}")) {
        version {
            strictly project.geckolib_version_range
            prefer project.geckolib_version
        }
    }

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            geckolib_version_range : geckolib_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

// HEROES_V2 13.7 / 14.1: the kit rules over the built-in hero definitions (HeroCheckMain), with no game running.
// ./gradlew checkHeroes [-PheroDir=<folder>[,<folder>...]] [-PheroStrict]; part of `check`.
tasks.register('checkHeroes', JavaExec) {
    group = 'verification'
    description = 'Validates the hero definitions (format 1 and 2) under data/factionclash/heroes.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.output + sourceSets.main.compileClasspath
    mainClass = 'com.factionclash.logic.hero.HeroCheckMain'
    var dirs = project.findProperty('heroDir')?.toString()?.split(',')?.toList() ?: ['src/main/resources/data/factionclash/heroes']
    args((project.hasProperty('heroStrict') ? ['--strict'] : []) + dirs)
    inputs.files(dirs.collect { file(it) }).optional().skipWhenEmpty(false)
}
tasks.named('check') { dependsOn 'checkHeroes' }

// Rewrites docs/heroes-v2/hero2.schema.json from HeroCatalogue (HeroSchemaGenTest holds the file to the generator).
tasks.register('heroSchema', JavaExec) {
    group = 'documentation'
    description = 'Writes the JSON Schema of hero format 2.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.output + sourceSets.main.compileClasspath
    mainClass = 'com.factionclash.logic.hero.HeroSchemaGen'
    args 'docs/heroes-v2/hero2.schema.json'
}
